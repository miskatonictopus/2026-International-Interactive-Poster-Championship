<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartel Itaca</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="cartel" id="cartel">
    <canvas id="canvas"></canvas>
    <div id="status" role="status">Preparing plastic…</div>
    <img class="juguetes" id="juguetes" src="public/img/juguetes.webp" alt="juguetes" width="1771" height="684">
    <img class="peque" id="peque" src="public/img/peque.webp" alt="peque" width="1200" height="397">
    <img class="ningun" id="ningun" src="public/img/ningun.webp" alt="ningún" width="1200" height="540">
    <img class="sin" id="sin" src="public/img/sin.webp" alt="sin" width="1075" height="742">
    <!-- Capa transparente del osito 3D, por encima de los textos -->
    <canvas id="teddy-canvas" aria-hidden="true"></canvas>
  </div>

  <script src="js/main.js"></script>
  <script src="js/juguetes.js"></script>
  <!-- Efecto "Fold" de mrdoob (Codevember 2026 / 01), licencia MIT -->
  <script type="module" src="js/fold/main.js"></script>
</body>
</html>
