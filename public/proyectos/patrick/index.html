<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moving Poster — Ningún niño sin regalo</title>
    <link rel="preload" href="./assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/style.css" />
    <script type="importmap">
      {"imports": {
        "three": "./js/vendor/three/build/three.module.js",
        "three/addons/": "./js/vendor/three/examples/jsm/",
        "cannon-es": "./js/vendor/cannon-es/cannon-es.js"
      }}
    </script>
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main class="poster" aria-labelledby="poster-title">
      <header class="poster__header">
        <h1 class="poster__title" id="poster-title">
          Ningún niño<br />sin regalo
        </h1>
      </header>
      <footer class="poster__footer" aria-label="Entidades participantes">
        <div class="poster__logos">
          <img class="poster__logo" src="./assets/images/logo-itaca.svg" alt="Colegio Ítaca" />
          <img class="poster__logo" src="./assets/images/logo-planetafp.webp" alt="PlanetaFP — Planeta Formación y Universidades" />
        </div>
        <p class="poster__date">21 de Diciembre</p>
      </footer>
    </main>
  </body>
</html>
